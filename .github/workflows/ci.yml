name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (RSpec + lint + security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_managing_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME_TEST: task_managing_system_test
      SECRET_KEY_BASE: ci_secret_key_base_not_used_in_tests
    steps:
      - uses: actions/checkout@v4

      - name: Install libpq (pg gem)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true # runs bundle install + caches gems

      - name: Prepare test database (structure.sql, no seed)
        run: bundle exec rails db:prepare

      - name: RSpec + SimpleCov (>=85%)
        run: bundle exec rspec

      - name: RuboCop (Shopify)
        run: bundle exec rubocop

      - name: Brakeman (security static analysis)
        run: bundle exec brakeman -q -w2

      - name: Bundler-audit (dependency CVEs)
        run: bundle exec bundler-audit check --update

  frontend:
    name: Frontend (tsc + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test --if-present

      - name: Production build
        run: npm run build
