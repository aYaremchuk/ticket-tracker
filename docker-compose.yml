# Three-tier stack. From the repo root: `docker compose up --build`.
#   web (nginx + built React SPA)  →  api (Rails)  →  db (PostgreSQL)
# nginx proxies /api to the api service, so the browser sees one origin.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_managing_system_development}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Published for host tooling (postgres MCP, psql). Override DB_PORT if 5432 is taken.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-task_managing_system_development}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev_secret_key_base_change_me}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # SMTP (used from M1)
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      SMTP_USER_NAME: ${SMTP_USER_NAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    expose:
      - "3000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
